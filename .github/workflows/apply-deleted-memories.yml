name: Apply shared Deleted Memories system

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/apply-deleted-memories.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: silver-deleted-memories-integration
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Silver
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Assemble and apply the recovery patch
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -s tools/apply-deleted-memories.py ]]; then
            cat tools/deleted-memories-patch/part-{00..05}.pyfrag > tools/apply-deleted-memories.py
          fi
          python3 -m py_compile tools/apply-deleted-memories.py
          python3 tools/apply-deleted-memories.py

      - name: Test and build the isolated mind-map application
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/silver-mind-map-build
          cp -a mind-map-source /tmp/silver-mind-map-build
          python3 - <<'PY'
          from pathlib import Path
          path = Path('/tmp/silver-mind-map-build/vite.config.ts')
          text = path.read_text()
          old = "base: command === 'serve' ? '/' : '/theory/',"
          new = "base: command === 'serve' ? '/' : '/Silver/mind-map/',"
          if text.count(old) != 1:
              raise SystemExit('Could not locate the pinned Theory build base.')
          path.write_text(text.replace(old, new, 1))
          PY

          pushd /tmp/silver-mind-map-build >/dev/null
          npm ci
          npm test
          npm run build
          popd >/dev/null

          cp mind-map/UPSTREAM.json /tmp/silver-mind-map-upstream.json
          rm -rf mind-map
          cp -a /tmp/silver-mind-map-build/dist mind-map
          cp /tmp/silver-mind-map-upstream.json mind-map/UPSTREAM.json
          python3 - <<'PY'
          from pathlib import Path
          import json
          path = Path('mind-map/UPSTREAM.json')
          data = json.loads(path.read_text())
          data['deploymentBase'] = '/Silver/mind-map/'
          data['integration'] = 'Pinned Theory behavior with Silver-only Map Your Mind and shared Deleted Memories bridges. The original theory repository is unchanged.'
          data['silverRecoveryBuild'] = '20260903-deleted-memories-1'
          path.write_text(json.dumps(data, indent=2) + '\n')
          PY

      - name: Verify both applications before committing
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/apply-deleted-memories.py --verify-only
          node --check bootstrap.js
          node --check sw.js
          node --check db.js
          node --check deleted-memories.js
          node --check src/app.js
          cp mind-map/assets/app.js /tmp/silver-mind-map-app.mjs
          node --check /tmp/silver-mind-map-app.mjs
          grep -Fq 'Deleted Memories' mind-map/assets/app.js
          grep -Fq 'silver-open-deleted-memories' mind-map/assets/app.js
          grep -Fq '/Silver/mind-map/assets/app.js' mind-map/index.html
          bash tools/assemble-silver-pages.sh /tmp/silver-deleted-memories-site
          test -s /tmp/silver-deleted-memories-site/deleted-memories.js
          test -s /tmp/silver-deleted-memories-site/mind-map/assets/app.js
          git diff --check

      - name: Commit the completed recovery system
        shell: bash
        run: |
          set -euo pipefail
          rm -rf tools/deleted-memories-patch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo 'Deleted Memories is already current.'
            exit 0
          fi
          git commit -m "Add shared 30-day Deleted Memories recovery"
          git pull --rebase origin main
          git push origin HEAD:main
