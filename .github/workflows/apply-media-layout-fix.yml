name: Apply Silver media and editor-layout fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-media-layout-fix.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Patch the maintainable source
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          app_path = Path('src/app.js')
          app = app_path.read_text()

          start = app.index('function renderAttachmentTray() {')
          end = app.index('\nfunction restoreDraftIntoEditor()', start)
          replacement = r'''function renderAttachmentTray() {
            revokeBucket(state.editorObjectUrls);
            el.attachmentCount.textContent = `${state.editorAttachments.length} / ${MAX_ATTACHMENTS}`;
            el.attachmentTray.innerHTML = state.editorAttachments.map(attachment => {
              const url = makeObjectUrl(attachment.blob, state.editorObjectUrls);
              let preview;
              if (attachment.kind === 'image') preview = `<img src="${url}" alt="" />`;
              else if (attachment.kind === 'video') preview = `<video src="${url}#t=0.1" muted playsinline preload="metadata"></video>`;
              else preview = `<div class="attachment-file">${icon(attachment.kind === 'audio' ? 'mic' : 'document')}<span>${escapeHtml(attachment.name)}</span></div>`;
              const detail = attachment.durationMs ? `${formatDuration(attachment.durationMs)} · ` : '';
              const verb = attachment.kind === 'video' || attachment.kind === 'audio' ? 'Play' : 'Open';
              const label = `${verb} ${attachment.name || 'attachment'}`;
              return `<article class="attachment-item">
                <button class="attachment-open" type="button" data-action="open-media" data-attachment-id="${escapeAttribute(attachment.id)}" aria-label="${escapeAttribute(label)}" title="${escapeAttribute(label)}">
                  ${preview}
                  <span class="attachment-label">${escapeHtml(detail + formatBytes(attachment.blob?.size || attachment.size || 0))}</span>
                </button>
                <button class="remove-attachment" type="button" data-remove-attachment="${escapeAttribute(attachment.id)}" aria-label="Remove ${escapeAttribute(attachment.name)}">${icon('close')}</button>
              </article>`;
            }).join('');
          }
          '''
          app = app[:start] + replacement + app[end:]

          viewer_needle = "  el.mediaDialog.showModal();\n}\n\nfunction closeMediaViewer()"
          viewer_replacement = """  el.mediaDialog.showModal();
            const playable = el.mediaViewerBody.querySelector('video, audio');
            if (playable) {
              playable.addEventListener('error', () => {
                showToast('This browser could not play this recording format. The original file is still available to download.', 5200);
              }, { once: true });
              playable.play().catch(() => { /* Native controls remain available when autoplay is restricted. */ });
            }
          }

          function closeMediaViewer()"""
          if viewer_needle not in app:
              raise SystemExit('Could not locate media viewer insertion point')
          app = app.replace(viewer_needle, viewer_replacement, 1)
          app_path.write_text(app)

          css_path = Path('src/styles.css')
          css = css_path.read_text()
          marker = '/* Silver editor viewport and attachment playback fix — 2026-09-01 */'
          if marker in css:
              css = css[:css.index(marker)].rstrip() + '\n'
          css += r'''

          /* Silver editor viewport and attachment playback fix — 2026-09-01 */
          .attachment-open {
            position: absolute;
            inset: 0;
            display: block;
            width: 100%;
            height: 100%;
            padding: 0;
            overflow: hidden;
            border: 0;
            border-radius: inherit;
            outline: 0;
            background: transparent;
            color: inherit;
            text-align: left;
            cursor: pointer;
          }
          .attachment-open img,
          .attachment-open video { pointer-events: none; }
          .attachment-open:hover { filter: brightness(.96); }
          .attachment-open:focus-visible {
            box-shadow: inset 0 0 0 3px color-mix(in srgb, var(--accent) 72%, white);
          }
          .attachment-item .remove-attachment { z-index: 3; }
          .attachment-item .attachment-label { z-index: 2; pointer-events: none; }

          @media (min-width: 761px) {
            .editor-dialog {
              width: min(1600px, calc(100vw - 20px));
              height: calc(100vh - 20px);
              height: calc(100dvh - 20px);
              max-height: calc(100vh - 20px);
              max-height: calc(100dvh - 20px);
            }
            .editor-form {
              display: grid;
              grid-template-rows: auto minmax(0, 1fr) auto;
              height: 100%;
              max-height: none;
            }
            .editor-dialog .dialog-header {
              padding: clamp(13px, 1.8vh, 20px) clamp(20px, 2.2vw, 32px);
            }
            .editor-dialog .dialog-header h2 {
              font-size: clamp(25px, 2vw, 31px);
            }
            .editor-grid {
              min-height: 0;
              grid-template-columns: minmax(0, 1fr) clamp(270px, 22vw, 340px);
              overflow: hidden;
            }
            .editor-main {
              display: grid;
              grid-template-rows: auto auto minmax(120px, 1fr) auto;
              min-height: 0;
              overflow: hidden;
              padding: clamp(16px, 2.2vh, 28px) clamp(20px, 2.7vw, 42px) clamp(14px, 2vh, 24px);
              border-right: 1px solid var(--line);
            }
            .title-input {
              padding-bottom: clamp(8px, 1.3vh, 13px);
              font-size: clamp(31px, 2.4vw, 40px);
            }
            .format-toolbar { margin: clamp(7px, 1.2vh, 14px) 0 4px; }
            #entryBody,
            .entry-preview {
              width: 100%;
              height: 100%;
              min-height: 0;
              overflow: auto;
              resize: none;
              padding: clamp(8px, 1.3vh, 15px) 3px;
              overscroll-behavior: contain;
            }
            .attachment-composer {
              min-height: 0;
              margin-top: clamp(9px, 1.6vh, 18px);
              padding-top: clamp(9px, 1.6vh, 18px);
            }
            .attachment-composer > header { margin-bottom: clamp(7px, 1vh, 12px); }
            .attachment-composer h3 { font-size: clamp(20px, 1.6vw, 24px); }
            .capture-actions {
              grid-template-columns: repeat(3, minmax(0, 1fr));
              gap: 8px;
            }
            .capture-actions > button,
            .file-action {
              min-height: 56px;
              padding: 9px 11px;
            }
            .attachment-tray {
              display: grid;
              grid-template-columns: none;
              grid-template-rows: clamp(76px, 10vh, 98px);
              grid-auto-flow: column;
              grid-auto-columns: clamp(110px, 10vw, 145px);
              gap: 8px;
              margin-top: 9px;
              padding: 0 2px 4px;
              overflow-x: auto;
              overflow-y: hidden;
              overscroll-behavior-inline: contain;
              scrollbar-width: thin;
            }
            .attachment-tray:empty { display: none; }
            .attachment-item {
              width: 100%;
              height: 100%;
              aspect-ratio: auto;
            }
            .editor-meta {
              display: flex;
              min-height: 0;
              overflow-y: auto;
              flex-direction: column;
              gap: clamp(9px, 1.4vh, 16px);
              padding: clamp(16px, 2.2vh, 28px) clamp(16px, 1.8vw, 25px);
              border-top: 0;
              overscroll-behavior: contain;
            }
            .editor-dialog .field { gap: 5px; }
            .editor-dialog .field input,
            .editor-dialog .field select { min-height: 38px; padding-block: 7px; }
            .editor-dialog .mood-picker button { max-height: 46px; }
            .editor-dialog .dialog-footer { padding: 10px 18px; }
          }

          @media (min-width: 761px) and (max-height: 780px) {
            .editor-dialog {
              width: calc(100vw - 12px);
              height: calc(100dvh - 12px);
              max-height: calc(100dvh - 12px);
              border-radius: 16px;
            }
            .editor-dialog .dialog-header { padding: 10px 18px; }
            .editor-dialog .dialog-header h2 { font-size: 24px; }
            .editor-main { padding: 12px 20px 10px; }
            .title-input { padding-bottom: 7px; font-size: 30px; }
            .format-toolbar { margin: 5px 0 2px; }
            #entryBody,
            .entry-preview { padding-block: 6px; font-size: 15px; line-height: 1.55; }
            .attachment-composer { margin-top: 7px; padding-top: 7px; }
            .attachment-composer > header { margin-bottom: 5px; }
            .attachment-composer h3 { font-size: 19px; }
            .capture-actions > button,
            .file-action { min-height: 45px; padding: 7px 9px; }
            .capture-actions small { display: none; }
            .attachment-tray {
              grid-template-rows: 68px;
              grid-auto-columns: 104px;
              margin-top: 6px;
            }
            .editor-meta { gap: 7px; padding: 11px 14px; }
            .editor-dialog .field input,
            .editor-dialog .field select { min-height: 34px; padding: 5px 8px; }
            .editor-dialog .field small { display: none; }
            .favourite-toggle > span { min-height: 35px; padding: 6px 9px; }
            .editor-meta > .secondary-button { min-height: 35px; padding: 6px 9px; }
            .editor-dialog .dialog-footer { padding: 8px 14px; }
          }
          '''
          css_path.write_text(css)

          Path('bootstrap.js').write_text(r'''const assets = {
            readable: {
              shell: './src/shell.html',
              styles: './src/styles.css',
              app: './src/app.js'
            },
            legacy: {
              shell: './shell.html.gz',
              styles: './styles.css.gz',
              appParts: [
                './app.source.1.b64', './app.source.2.b64', './app.source.3.b64', './app.source.4.b64',
                './app.source.5.b64', './app.source.6.b64', './app.source.7.b64', './app.source.8.b64'
              ]
            }
          };

          async function fetchText(path) {
            const response = await fetch(path, { cache: 'no-cache' });
            if (!response.ok) throw new Error(`Silver could not load ${path} (${response.status}).`);
            return response.text();
          }

          function requireStreams() {
            if (!('DecompressionStream' in globalThis)) {
              throw new Error('Silver needs a current browser with gzip stream support. Update Chrome, Edge, Firefox or Safari, then reload.');
            }
          }

          async function decompressResponse(path) {
            requireStreams();
            const response = await fetch(path, { cache: 'no-cache' });
            if (!response.ok || !response.body) throw new Error(`Silver could not load ${path} (${response.status}).`);
            return new Response(response.body.pipeThrough(new DecompressionStream('gzip'))).text();
          }

          async function decompressBase64Parts(paths) {
            requireStreams();
            const responses = await Promise.all(paths.map(path => fetch(path, { cache: 'no-cache' })));
            const failed = responses.find(response => !response.ok);
            if (failed) throw new Error(`Silver could not load its journal engine (${failed.status}).`);
            const encoded = (await Promise.all(responses.map(response => response.text()))).join('');
            const binary = atob(encoded.trim());
            const bytes = Uint8Array.from(binary, character => character.charCodeAt(0));
            return new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
          }

          async function loadBundle() {
            try {
              const [markup, styles, sourceText] = await Promise.all([
                fetchText(assets.readable.shell),
                fetchText(assets.readable.styles),
                fetchText(assets.readable.app)
              ]);
              return { markup, styles, sourceText };
            } catch (readableError) {
              console.warn('Silver readable bundle was unavailable; using the packaged fallback.', readableError);
              const [markup, styles, sourceText] = await Promise.all([
                decompressResponse(assets.legacy.shell),
                decompressResponse(assets.legacy.styles),
                decompressBase64Parts(assets.legacy.appParts)
              ]);
              return { markup, styles, sourceText };
            }
          }

          async function boot() {
            const { markup, styles, sourceText } = await loadBundle();
            document.getElementById('silverStyles').textContent = styles;
            document.getElementById('boot').outerHTML = markup;

            const dbUrl = new URL('./db.js', import.meta.url).href;
            const archiveUrl = new URL('./archive.js', import.meta.url).href;
            const source = sourceText
              .replaceAll("'./db.js'", JSON.stringify(dbUrl))
              .replaceAll("'./archive.js'", JSON.stringify(archiveUrl));
            const moduleUrl = URL.createObjectURL(new Blob([source], { type: 'text/javascript' }));
            try {
              await import(moduleUrl);
            } finally {
              URL.revokeObjectURL(moduleUrl);
            }
          }

          boot().catch(error => {
            console.error(error);
            const target = document.getElementById('boot') || document.body;
            const message = String(error.message || error).replace(/[&<>"']/g, character => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[character]));
            target.innerHTML = `<div class="boot-error"><div class="boot-mark">S</div><h1>Silver could not open</h1><p>${message}</p><button type="button" onclick="location.reload()">Try again</button></div>`;
          });
          ''')

          Path('sw.js').write_text(r'''const CACHE_NAME = 'silver-shell-v2';
          const SHELL = [
            './', './index.html', './bootstrap.js',
            './src/shell.html', './src/styles.css', './src/app.js',
            './shell.html.gz', './styles.css.gz',
            './app.source.1.b64', './app.source.2.b64', './app.source.3.b64', './app.source.4.b64',
            './app.source.5.b64', './app.source.6.b64', './app.source.7.b64', './app.source.8.b64',
            './db.js', './archive.js', './manifest.webmanifest', './icons/silver-mark.svg'
          ];

          self.addEventListener('install', event => {
            event.waitUntil(caches.open(CACHE_NAME).then(cache => cache.addAll(SHELL)).then(() => self.skipWaiting()));
          });

          self.addEventListener('activate', event => {
            event.waitUntil(
              caches.keys()
                .then(keys => Promise.all(keys.filter(key => key !== CACHE_NAME).map(key => caches.delete(key))))
                .then(() => self.clients.claim())
            );
          });

          async function networkFirst(request) {
            const cache = await caches.open(CACHE_NAME);
            try {
              const response = await fetch(request);
              if (response.ok) await cache.put(request, response.clone());
              return response;
            } catch {
              return (await caches.match(request, { ignoreSearch: true })) || Response.error();
            }
          }

          self.addEventListener('fetch', event => {
            if (event.request.method !== 'GET') return;
            const url = new URL(event.request.url);
            if (url.origin !== self.location.origin) return;

            const isRuntimeCode = event.request.mode === 'navigate'
              || url.pathname.endsWith('/bootstrap.js')
              || url.pathname.includes('/src/');
            if (isRuntimeCode) {
              event.respondWith(networkFirst(event.request));
              return;
            }

            event.respondWith(
              caches.match(event.request, { ignoreSearch: true }).then(cached => {
                const network = fetch(event.request).then(response => {
                  if (response.ok) caches.open(CACHE_NAME).then(cache => cache.put(event.request, response.clone()));
                  return response;
                }).catch(() => cached);
                return cached || network;
              })
            );
          });

          self.addEventListener('notificationclick', event => {
            event.notification.close();
            event.waitUntil(
              self.clients.matchAll({ type: 'window', includeUncontrolled: true }).then(clients => {
                const existing = clients.find(client => 'focus' in client);
                return existing ? existing.focus() : self.clients.openWindow('./?new=1');
              })
            );
          });
          ''')

          index_path = Path('index.html')
          index = index_path.read_text().replace('./bootstrap.js?v=1', './bootstrap.js?v=2')
          index_path.write_text(index)

          pages_path = Path('.github/workflows/pages.yml')
          pages = pages_path.read_text()
          pages = pages.replace(
              '          node --check /tmp/silver-sw.mjs\n          python3 -m json.tool manifest.webmanifest >/dev/null',
              '          node --check /tmp/silver-sw.mjs\n          node --check src/app.js\n          python3 -m json.tool manifest.webmanifest >/dev/null\n          grep -Fq \'data-action="open-media"\' src/app.js\n          grep -Fq \'Silver editor viewport and attachment playback fix\' src/styles.css'
          )
          pages = pages.replace('          mkdir -p _site/icons', '          mkdir -p _site/icons _site/src')
          pages = pages.replace(
              '          cp icons/silver-mark.svg _site/icons/',
              '          cp icons/silver-mark.svg _site/icons/\n          cp src/app.js src/shell.html src/styles.css _site/src/'
          )
          pages = pages.replace(
              '          test -s _site/styles.css.gz',
              '          test -s _site/styles.css.gz\n          test -s _site/src/app.js\n          test -s _site/src/shell.html\n          test -s _site/src/styles.css'
          )
          pages = pages.replace('          mkdir -p /tmp/silver-live', '          mkdir -p /tmp/silver-live/src')
          pages = pages.replace(
              '          files=(bootstrap.js shell.html.gz styles.css.gz db.js archive.js sw.js manifest.webmanifest)',
              '          files=(bootstrap.js shell.html.gz styles.css.gz db.js archive.js sw.js manifest.webmanifest src/app.js src/shell.html src/styles.css)'
          )
          pages_path.write_text(pages)

          readme_path = Path('README.md')
          readme = readme_path.read_text()
          old = '''- `index.html` — small accessible boot shell and failure fallback
          - `bootstrap.js` — reconstructs and starts the tested interface bundle in-browser
          - `shell.html.gz` — compressed accessible application markup
          - `styles.css.gz` — compressed responsive visual system
          - `app.source.1.b64` … `app.source.8.b64` — exact gzip/base64 segments of the application engine'''
          new = '''- `index.html` — small accessible boot shell and failure fallback
          - `bootstrap.js` — loads the readable application bundle and retains the packaged release as a fallback
          - `src/shell.html` — canonical accessible application markup
          - `src/styles.css` — canonical responsive visual system
          - `src/app.js` — canonical application engine
          - `shell.html.gz`, `styles.css.gz`, `app.source.1.b64` … `app.source.8.b64` — backward-compatible packaged fallback'''
          if old in readme:
              readme = readme.replace(old, new)
          readme_path.write_text(readme)
          PY

          node --check src/app.js
          node --check bootstrap.js
          node --check sw.js
          grep -Fq 'data-action="open-media"' src/app.js
          grep -Fq 'height: calc(100dvh - 20px)' src/styles.css
          git diff --check

      - name: Commit and push the fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app.js src/styles.css bootstrap.js sw.js index.html README.md .github/workflows/pages.yml
          git commit -m "Fix media playback and fit editor at 100 percent zoom"
          git push
