name: Integrate Theory mind map into Silver

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/integrate-theory-mind-map.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: silver-theory-mind-map-integration
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: ubuntu-latest
    env:
      THEORY_REPOSITORY: dream-unity/theory
      THEORY_COMMIT: 78c88c42d2c45f46db480b6499bda90556ba944c
      SILVER_BUILD: 20260903-map-your-mind-1
    steps:
      - name: Check out Silver
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up the Theory build toolchain
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Copy, test, build and isolate Theory
        shell: bash
        run: python3 tools/integrate-theory-mind-map.py

      - name: Commit the integrated application
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mind-map mind-map-source src/app.js src/shell.html src/styles.css bootstrap.js index.html sw.js README.md
          if git diff --cached --quiet; then
            echo "The Theory mind-map integration is already current."
            exit 0
          fi
          git commit -m "Add Map Your Mind with isolated Theory application"
          git pull --rebase origin main
          git push origin HEAD:main
