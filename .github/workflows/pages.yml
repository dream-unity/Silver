name: Deploy Silver to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: silver-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Verify and assemble static release
        shell: bash
        run: |
          set -euo pipefail
          node --check bootstrap.js
          node --check db.js
          node --check archive.js
          node --check sw.js
          node --check src/app.js
          node --check src/db.js
          node --check src/archive.js
          python3 -m json.tool manifest.webmanifest >/dev/null
          grep -Fq "app: './src/app.js'" bootstrap.js
          grep -Fq 'data-action="open-media"' src/app.js
          grep -Fq 'Silver editor viewport and attachment playback fix' src/styles.css

          rm -rf _site
          mkdir -p _site/icons _site/src
          cp index.html bootstrap.js db.js archive.js sw.js manifest.webmanifest .nojekyll _site/
          cp icons/silver-mark.svg _site/icons/
          cp src/app.js src/db.js src/archive.js src/shell.html src/styles.css _site/src/

          test -s _site/index.html
          test -s _site/bootstrap.js
          test -s _site/src/app.js
          test -s _site/src/db.js
          test -s _site/src/archive.js
          test -s _site/src/shell.html
          test -s _site/src/styles.css

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload verified static site
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          include-hidden-files: true

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  smoke:
    name: Verify the live Silver application
    runs-on: ubuntu-latest
    needs: deploy
    env:
      SITE_URL: ${{ needs.deploy.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Compare published files with main
        shell: bash
        run: |
          set -euo pipefail
          BASE="${SITE_URL%/}/"
          mkdir -p /tmp/silver-live/src /tmp/silver-live/icons

          for attempt in {1..20}; do
            if curl --fail --silent --show-error --location \
              "${BASE}index.html?commit=${GITHUB_SHA}&attempt=${attempt}" \
              --output /tmp/silver-live/index.html; then
              if grep -Fq 'Silver · Private video journal' /tmp/silver-live/index.html; then
                break
              fi
            fi
            sleep 3
          done

          test -s /tmp/silver-live/index.html
          grep -Fq 'Silver · Private video journal' /tmp/silver-live/index.html

          files=(bootstrap.js db.js archive.js sw.js manifest.webmanifest src/app.js src/db.js src/archive.js src/shell.html src/styles.css icons/silver-mark.svg)
          for file in "${files[@]}"; do
            curl --fail --silent --show-error --location --retry 5 --retry-all-errors \
              "${BASE}${file}?commit=${GITHUB_SHA}" --output "/tmp/silver-live/${file}"
            cmp --silent "$file" "/tmp/silver-live/${file}"
          done

          node --check /tmp/silver-live/bootstrap.js
          node --check /tmp/silver-live/db.js
          node --check /tmp/silver-live/archive.js
          node --check /tmp/silver-live/sw.js
          node --check /tmp/silver-live/src/app.js
          node --check /tmp/silver-live/src/db.js
          node --check /tmp/silver-live/src/archive.js
          python3 -m json.tool /tmp/silver-live/manifest.webmanifest >/dev/null

      - name: Open the deployed app in Chrome
        shell: bash
        run: |
          set -euo pipefail
          BASE="${SITE_URL%/}/"
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"
          "$CHROME" --version
          rm -rf /tmp/silver-chrome

          if ! "$CHROME" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --disable-dev-shm-usage \
            --hide-scrollbars \
            --user-data-dir=/tmp/silver-chrome \
            --window-size=1440,900 \
            --virtual-time-budget=20000 \
            --dump-dom \
            "${BASE}?smoke=${GITHUB_SHA}" \
            > /tmp/silver-live/dom.html \
            2> /tmp/silver-live/chrome.log; then
            cat /tmp/silver-live/chrome.log >&2
            exit 1
          fi

          "$CHROME" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --disable-dev-shm-usage \
            --hide-scrollbars \
            --user-data-dir=/tmp/silver-chrome-shot \
            --window-size=1440,900 \
            --virtual-time-budget=20000 \
            --screenshot=/tmp/silver-live/silver-live.png \
            "${BASE}?screenshot=${GITHUB_SHA}" \
            >> /tmp/silver-live/chrome.log 2>&1

          test -s /tmp/silver-live/silver-live.png

          assert_dom() {
            local marker="$1"
            local description="$2"
            if grep -Fq "$marker" /tmp/silver-live/dom.html; then
              echo "PASS: $description"
            else
              echo "FAIL: $description (missing marker: $marker)" >&2
              tail -240 /tmp/silver-live/dom.html >&2
              cat /tmp/silver-live/chrome.log >&2
              exit 1
            fi
          }

          assert_dom 'data-journal-id="journal-personal"' 'IndexedDB seeded the Personal journal'
          assert_dom '<span>Personal</span>' 'The journal sidebar rendered'
          assert_dom 'Your latest entries' 'The Today view rendered'

          if grep -Fq 'Silver could not open' /tmp/silver-live/dom.html; then
            echo 'FAIL: the application rendered its fatal-error state.' >&2
            exit 1
          fi

          printf '### Live verification passed\n\n- Published files match `main`.\n- The direct readable runtime loaded successfully.\n- IndexedDB initialized the default journal.\n- The Today view rendered in headless Chrome.\n' >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve live verification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: silver-live-verification
          path: |
            /tmp/silver-live/silver-live.png
            /tmp/silver-live/dom.html
            /tmp/silver-live/chrome.log
          if-no-files-found: warn
          retention-days: 14
