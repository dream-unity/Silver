name: Deploy Silver to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: silver-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Verify Silver and assemble the isolated release
        shell: bash
        run: bash tools/assemble-silver-pages.sh _site

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload verified static site
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          include-hidden-files: true

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  smoke:
    name: Verify Silver and Map Your Mind live
    runs-on: ubuntu-latest
    needs: deploy
    env:
      SITE_URL: ${{ needs.deploy.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node for browser verification
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Compare the published Silver and Theory files with main
        shell: bash
        run: bash tools/verify-published-pages.sh "$SITE_URL" "$GITHUB_SHA" /tmp/silver-live

      - name: Exercise Silver, Map Your Mind and the return path
        shell: bash
        run: bash tools/run-live-browser-check.sh "$SITE_URL" "$GITHUB_SHA" /tmp/silver-live

      - name: Record successful verification
        shell: bash
        run: |
          printf '### Silver + Map Your Mind live verification passed\n\n- Published Silver files and the complete namespaced Theory build match `main`.\n- Silver initialized, retained its 100%%-zoom editor layout and saved a journal entry.\n- **Map Your Mind** occupies the replaced Today card and opens the copied Theory application.\n- The Theory interface created a blank map and a linked thought, then persisted it locally.\n- Closing and reopening the full-screen map preserved both applications independently.\n- Returning to Silver retained the journal entry and Today interface.\n- Chrome reported no page exceptions or console errors.\n' >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve live verification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: silver-map-your-mind-live-verification
          path: |
            /tmp/silver-live/silver-before-map.png
            /tmp/silver-live/map-your-mind-start.png
            /tmp/silver-live/map-your-mind-working.png
            /tmp/silver-live/silver-after-map.png
            /tmp/silver-live/dom.html
            /tmp/silver-live/chrome.log
            /tmp/silver-live/browser-evidence.json
          if-no-files-found: warn
          retention-days: 14
