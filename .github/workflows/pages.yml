name: Deploy Silver to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: silver-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Verify and assemble static release
        shell: bash
        run: |
          set -euo pipefail
          gzip -t shell.html.gz styles.css.gz
          cat app.source.{1..8}.b64 | base64 --decode | gzip --decompress > /tmp/silver-app.mjs
          cp db.js /tmp/silver-db.mjs
          cp archive.js /tmp/silver-archive.mjs
          cp bootstrap.js /tmp/silver-bootstrap.mjs
          cp sw.js /tmp/silver-sw.mjs
          node --check /tmp/silver-app.mjs
          node --check /tmp/silver-db.mjs
          node --check /tmp/silver-archive.mjs
          node --check /tmp/silver-bootstrap.mjs
          node --check /tmp/silver-sw.mjs
          python3 -m json.tool manifest.webmanifest >/dev/null

          rm -rf _site
          mkdir -p _site/icons
          cp index.html bootstrap.js shell.html.gz styles.css.gz \
             app.source.*.b64 db.js archive.js sw.js manifest.webmanifest \
             .nojekyll _site/
          cp icons/silver-mark.svg _site/icons/

          test -s _site/index.html
          test -s _site/shell.html.gz
          test -s _site/styles.css.gz
          test "$(find _site -maxdepth 1 -name 'app.source.*.b64' | wc -l)" -eq 8

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload verified static site
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          include-hidden-files: true

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
