name: Deploy Silver to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: silver-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Verify and assemble static release
        shell: bash
        run: |
          set -euo pipefail
          gzip -t shell.html.gz styles.css.gz
          cat app.source.{1..8}.b64 | base64 --decode | gzip --decompress > /tmp/silver-app.mjs
          cp db.js /tmp/silver-db.mjs
          cp archive.js /tmp/silver-archive.mjs
          cp bootstrap.js /tmp/silver-bootstrap.mjs
          cp sw.js /tmp/silver-sw.mjs
          node --check /tmp/silver-app.mjs
          node --check /tmp/silver-db.mjs
          node --check /tmp/silver-archive.mjs
          node --check /tmp/silver-bootstrap.mjs
          node --check /tmp/silver-sw.mjs
          python3 -m json.tool manifest.webmanifest >/dev/null

          rm -rf _site
          mkdir -p _site/icons
          cp index.html bootstrap.js shell.html.gz styles.css.gz \
             app.source.*.b64 db.js archive.js sw.js manifest.webmanifest \
             .nojekyll _site/
          cp icons/silver-mark.svg _site/icons/

          test -s _site/index.html
          test -s _site/shell.html.gz
          test -s _site/styles.css.gz
          test "$(find _site -maxdepth 1 -name 'app.source.*.b64' | wc -l)" -eq 8

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload verified static site
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          include-hidden-files: true

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  smoke:
    name: Verify the live Silver application
    runs-on: ubuntu-latest
    needs: deploy
    env:
      SITE_URL: ${{ needs.deploy.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Compare published files with main
        shell: bash
        run: |
          set -euo pipefail
          BASE="${SITE_URL%/}/"
          mkdir -p /tmp/silver-live

          for attempt in {1..20}; do
            if curl --fail --silent --show-error --location \
              "${BASE}index.html?commit=${GITHUB_SHA}&attempt=${attempt}" \
              --output /tmp/silver-live/index.html; then
              break
            fi
            sleep 3
          done

          test -s /tmp/silver-live/index.html
          grep -q 'Silver · Private video journal' /tmp/silver-live/index.html

          files=(bootstrap.js shell.html.gz styles.css.gz db.js archive.js sw.js manifest.webmanifest)
          for file in "${files[@]}"; do
            curl --fail --silent --show-error --location --retry 5 --retry-all-errors \
              "${BASE}${file}?commit=${GITHUB_SHA}" --output "/tmp/silver-live/${file}"
            cmp --silent "$file" "/tmp/silver-live/${file}"
          done

          for number in {1..8}; do
            file="app.source.${number}.b64"
            curl --fail --silent --show-error --location --retry 5 --retry-all-errors \
              "${BASE}${file}?commit=${GITHUB_SHA}" --output "/tmp/silver-live/${file}"
            cmp --silent "$file" "/tmp/silver-live/${file}"
          done

          cat /tmp/silver-live/app.source.{1..8}.b64 \
            | base64 --decode \
            | gzip --decompress > /tmp/silver-live/app.mjs
          node --check /tmp/silver-live/app.mjs
          gzip -t /tmp/silver-live/shell.html.gz /tmp/silver-live/styles.css.gz
          python3 -m json.tool /tmp/silver-live/manifest.webmanifest >/dev/null

      - name: Open the deployed app in Chrome
        shell: bash
        run: |
          set -euo pipefail
          BASE="${SITE_URL%/}/"
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"

          "$CHROME" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --disable-dev-shm-usage \
            --hide-scrollbars \
            --window-size=1440,1000 \
            --virtual-time-budget=15000 \
            --dump-dom \
            "${BASE}?smoke=${GITHUB_SHA}" \
            > /tmp/silver-live/dom.html \
            2> /tmp/silver-live/chrome.log

          grep -q 'data-journal-id="journal-personal"' /tmp/silver-live/dom.html
          grep -q '>Personal<' /tmp/silver-live/dom.html
          grep -q 'Your latest entries' /tmp/silver-live/dom.html
          ! grep -q 'Silver could not open' /tmp/silver-live/dom.html

          "$CHROME" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --disable-dev-shm-usage \
            --hide-scrollbars \
            --window-size=1440,1000 \
            --virtual-time-budget=15000 \
            --screenshot=/tmp/silver-live/silver-live.png \
            "${BASE}?screenshot=${GITHUB_SHA}"

          test -s /tmp/silver-live/silver-live.png
          printf '### Live verification passed\n\n- Published files match `main`.\n- IndexedDB initialized the default journal.\n- The rendered application opened successfully in headless Chrome.\n' >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve live verification evidence
        uses: actions/upload-artifact@v7
        with:
          name: silver-live-verification
          path: |
            /tmp/silver-live/silver-live.png
            /tmp/silver-live/dom.html
            /tmp/silver-live/chrome.log
          retention-days: 14
