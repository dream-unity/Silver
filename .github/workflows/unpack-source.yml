name: Expose maintainable Silver source

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/unpack-source.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Reconstruct readable source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf src
          ./tools/unpack-source.sh src
          node --check src/app.js
          test -s src/shell.html
          test -s src/styles.css

      - name: Commit readable source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app.js src/shell.html src/styles.css
          if git diff --cached --quiet; then
            echo "Readable source is already current."
            exit 0
          fi
          git commit -m "Expose maintainable Silver source"
          git push
