<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#eef0f4" />
  <meta name="description" content="Silver is a private, video-first journal that lives in your browser." />
  <title>Silver · Private video journal</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icons/silver-mark.svg" type="image/svg+xml" />
  <style id="silverStyles">
    :root{font-family:system-ui,sans-serif;background:#eef0f4;color:#20232b;color-scheme:light dark}
    *{box-sizing:border-box}body{margin:0}.boot{min-height:100svh;display:grid;place-items:center;padding:24px;text-align:center}
    .boot-mark{width:68px;height:68px;border-radius:20px;display:grid;place-items:center;margin:auto;background:#171a21;color:#eef0f4;font:600 32px Georgia,serif;box-shadow:0 18px 55px #1f243433}
    .boot h1{margin:20px 0 8px;font:500 34px Georgia,serif}.boot p{margin:0;color:#697080}.boot i{display:block;width:112px;height:2px;margin:24px auto 0;background:#1d223020;overflow:hidden}.boot i::after{content:"";display:block;width:45%;height:100%;background:#687185;animation:load 1.1s ease-in-out infinite}@keyframes load{from{transform:translateX(-110%)}to{transform:translateX(245%)}}
    .boot-error{max-width:540px}.boot-error button{margin-top:20px;border:0;border-radius:12px;padding:12px 18px;background:#20242e;color:white;font:inherit;cursor:pointer}
  </style>
</head>
<body>
  <noscript><div class="boot"><div><div class="boot-mark">S</div><h1>JavaScript is required</h1><p>Silver uses JavaScript to keep your private journal on this device.</p></div></div></noscript>
  <main class="boot" id="boot" aria-live="polite"><div><div class="boot-mark">S</div><h1>Opening Silver</h1><p>Preparing your private journal…</p><i aria-hidden="true"></i></div></main>
  <script type="module" src="./bootstrap.js?v=20260901-media-layout-1"></script>
</body>
</html>
