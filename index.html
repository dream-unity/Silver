<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#eef0f4" />
  <meta name="description" content="Silver is a private, video-first journal that lives in your browser." />
  <title>Silver · Private video journal</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icons/silver-mark.svg" type="image/svg+xml" />
  <style id="silverStyles">
    :root{font-family:system-ui,sans-serif;background:#eef0f4;color:#20232b;color-scheme:light dark}
    *{box-sizing:border-box}body{margin:0}.boot{min-height:100svh;display:grid;place-items:center;padding:24px;text-align:center}
    .boot-mark{width:68px;height:68px;border-radius:20px;display:grid;place-items:center;margin:auto;background:#171a21;color:#eef0f4;font:600 32px Georgia,serif;box-shadow:0 18px 55px #1f243433}
    .boot h1{margin:20px 0 8px;font:500 34px Georgia,serif}.boot p{margin:0;color:#697080}.boot i{display:block;width:112px;height:2px;margin:24px auto 0;background:#1d223020;overflow:hidden}.boot i::after{content:"";display:block;width:45%;height:100%;background:#687185;animation:load 1.1s ease-in-out infinite}@keyframes load{from{transform:translateX(-110%)}to{transform:translateX(245%)}}
    .boot-error{max-width:540px}.boot-error button{margin-top:20px;border:0;border-radius:12px;padding:12px 18px;background:#20242e;color:white;font:inherit;cursor:pointer}
  </style>
  <style id="recorderViewportStyles">
    /* Silver recorder viewport containment fix — 2026-09-01 */
    :root {
      --silver-visual-viewport-height: 100vh;
    }
    @supports (height: 100dvh) {
      :root { --silver-visual-viewport-height: 100dvh; }
    }

    .recorder-dialog {
      width: min(920px, calc(100vw - 24px));
      height: min(820px, calc(var(--silver-visual-viewport-height) - 24px));
      max-height: calc(var(--silver-visual-viewport-height) - 24px);
      min-height: 0;
      overflow: hidden;
      overscroll-behavior: contain;
    }

    .recorder-shell {
      display: grid;
      grid-template-areas:
        "recorder-header"
        "recorder-stage"
        "recorder-message"
        "recorder-controls"
        "recorder-transcript";
      grid-template-rows: auto minmax(0, 1fr) auto auto auto;
      width: 100%;
      height: 100%;
      min-height: 0;
      max-height: none;
      overflow: hidden;
    }

    .recorder-shell > .dialog-header {
      grid-area: recorder-header;
      flex: 0 0 auto;
    }

    .recorder-stage {
      grid-area: recorder-stage;
      width: 100%;
      height: 100%;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
    }

    .recorder-stage video {
      display: block;
      width: 100%;
      height: 100%;
      min-width: 0;
      min-height: 0;
      max-width: 100%;
      max-height: 100%;
      object-fit: cover;
    }

    .recorder-idle {
      min-width: 0;
      min-height: 0;
      overflow: auto;
      overscroll-behavior: contain;
    }

    .recorder-message {
      grid-area: recorder-message;
      min-height: 0;
      margin: 0;
      padding: 9px 18px 0;
      line-height: 1.35;
    }

    .recorder-controls {
      grid-area: recorder-controls;
      position: relative;
      z-index: 2;
      min-width: 0;
      min-height: 0;
      max-height: 32vh;
      margin: 0;
      padding: 10px 16px max(12px, env(safe-area-inset-bottom));
      overflow-x: hidden;
      overflow-y: auto;
      border-top: 1px solid var(--line);
      background: var(--surface);
      overscroll-behavior: contain;
      scrollbar-width: thin;
    }

    .recorder-controls > button {
      flex: 0 1 auto;
    }

    .transcript-panel {
      grid-area: recorder-transcript;
      min-width: 0;
      min-height: 0;
      max-height: min(128px, 20vh);
      margin: 0 16px max(10px, env(safe-area-inset-bottom));
      overflow: hidden;
    }

    .transcript-panel p {
      max-height: min(82px, 13vh);
    }

    @media (max-width: 760px) {
      .recorder-dialog {
        width: 100vw;
        height: var(--silver-visual-viewport-height);
        max-height: var(--silver-visual-viewport-height);
        border: 0;
        border-radius: 0;
      }

      .recorder-shell > .dialog-header {
        padding-top: max(17px, env(safe-area-inset-top));
        padding-right: max(18px, env(safe-area-inset-right));
        padding-left: max(18px, env(safe-area-inset-left));
      }

      .recorder-controls {
        padding-right: max(12px, env(safe-area-inset-right));
        padding-left: max(12px, env(safe-area-inset-left));
      }
    }

    @media (max-height: 760px) {
      .recorder-dialog {
        width: min(1100px, 100vw);
        height: var(--silver-visual-viewport-height);
        max-height: var(--silver-visual-viewport-height);
        border-top: 0;
        border-bottom: 0;
        border-radius: 0;
      }

      .recorder-shell > .dialog-header {
        padding: max(9px, env(safe-area-inset-top)) max(14px, env(safe-area-inset-right)) 9px max(14px, env(safe-area-inset-left));
      }

      .recorder-shell > .dialog-header .eyebrow {
        display: none;
      }

      .recorder-shell > .dialog-header h2 {
        margin: 0;
        font-size: clamp(22px, 5.1vh, 28px);
      }

      .recorder-shell > .dialog-header .icon-button {
        width: 36px;
        height: 36px;
      }

      .recorder-idle {
        padding: clamp(10px, 3vh, 22px);
      }

      .recorder-idle svg {
        width: clamp(34px, 7vh, 46px);
        height: clamp(34px, 7vh, 46px);
        margin-bottom: clamp(7px, 1.8vh, 13px);
      }

      .recorder-idle strong {
        font-size: clamp(14px, 2.7vh, 16px);
      }

      .recorder-idle span {
        margin-top: 3px;
        font-size: 10px;
      }

      .recording-badge {
        top: 10px;
        left: max(10px, env(safe-area-inset-left));
      }

      .recorder-message {
        padding: 6px 12px 0;
        font-size: 10px;
      }

      .recorder-controls {
        gap: 6px;
        max-height: 34vh;
        padding: 7px max(10px, env(safe-area-inset-right)) max(8px, env(safe-area-inset-bottom)) max(10px, env(safe-area-inset-left));
      }

      .recorder-controls > button {
        min-height: 38px;
        padding: 7px 12px;
      }

      .transcript-panel {
        max-height: min(96px, 20vh);
        margin: 0 10px max(6px, env(safe-area-inset-bottom));
        padding: 8px 11px;
      }

      .transcript-panel p {
        max-height: min(54px, 12vh);
        margin-top: 4px;
      }
    }

    @media (max-height: 520px) {
      .recorder-shell > .dialog-header {
        padding-top: max(5px, env(safe-area-inset-top));
        padding-bottom: 5px;
      }

      .recorder-shell > .dialog-header h2 {
        font-size: 20px;
      }

      .recorder-shell > .dialog-header .icon-button {
        width: 32px;
        height: 32px;
      }

      .recorder-idle span {
        display: none;
      }

      .recorder-message {
        padding-top: 3px;
        font-size: 9px;
      }

      .recorder-controls {
        gap: 5px;
        max-height: 40vh;
        padding-top: 5px;
        padding-bottom: max(6px, env(safe-area-inset-bottom));
      }

      .recorder-controls > button {
        min-height: 34px;
        padding: 5px 9px;
        font-size: 12px;
      }
    }
  </style>
  <!-- Recorder viewport regression marker: 20260901-recorder-viewport-2 -->
</head>
<body>
  <noscript><div class="boot"><div><div class="boot-mark">S</div><h1>JavaScript is required</h1><p>Silver uses JavaScript to keep your private journal on this device.</p></div></div></noscript>
  <main class="boot" id="boot" aria-live="polite"><div><div class="boot-mark">S</div><h1>Opening Silver</h1><p>Preparing your private journal…</p><i aria-hidden="true"></i></div></main>
  <script type="module" src="./bootstrap.js?v=20260903-map-your-mind-1"></script>
</body>
</html>
